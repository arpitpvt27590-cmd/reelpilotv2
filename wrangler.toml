name = "reelpilot"
main = "src/index.js"
compatibility_date = "2026-10-01"
workers_dev = true

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "reelpilot-db"
database_id = "REPLACE_WITH_D1_DATABASE_ID"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "reelpilot-media"

[[queues.producers]]
binding = "PUBLISH_QUEUE"
queue = "reelpilot-publish"

[[queues.consumers]]
queue = "reelpilot-publish"
max_batch_size = 1
max_retries = 5
max_batch_timeout = 5

[triggers]
crons = ["*/5 * * * *"]

[vars]
GRAPH_API_VERSION = "v24.0"
MAX_VIDEO_BYTES = "95000000"
APP_BASE_URL = "https://YOUR-WORKER.workers.dev"
